<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="marbleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F0EC"/>
      <stop offset="50%" stop-color="#E5E0D8"/>
      <stop offset="100%" stop-color="#D0C9BE"/>
    </linearGradient>
    <radialGradient id="whippedCream" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAFAFA"/>
      <stop offset="90%" stop-color="#EFEFEF"/>
      <stop offset="100%" stop-color="#D9D9D9"/>
    </radialGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="spoonMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#C0C0C0"/>
      <stop offset="70%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <radialGradient id="strawberryRed" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="60%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Bright Marble Countertop Background -->
  <rect width="1200" height="675" fill="url(#marbleBg)"/>
  <!-- Marble veins -->
  <path d="M0,100 Q400,250 800,150 T1200,300" stroke="#C0B8AC" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M100,500 Q500,400 900,550" stroke="#C0B8AC" stroke-width="3" fill="none" opacity="0.3"/>

  <!-- Top Right Glass Bowl with Sliced Fresh Red Strawberries -->
  <g transform="translate(950, 150)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Sliced Strawberries inside bowl -->
    <path d="M-80,-20 C-60,-50 -20,-40 -10,-10 C-30,20 -70,10 -80,-20 Z" fill="url(#strawberryRed)"/>
    <path d="M-10,-30 C10,-60 60,-40 50,0 C20,20 -20,0 -10,-30 Z" fill="url(#strawberryRed)"/>
    <path d="M20,-10 C50,-30 90,-10 70,30 C30,40 10,20 20,-10 Z" fill="url(#strawberryRed)"/>
    <!-- Strawberry seeds -->
    <g fill="#FFE082">
      <circle cx="-50" cy="-20" r="1.5"/><circle cx="-30" cy="-10" r="1.5"/><circle cx="20" cy="-20" r="1.5"/><circle cx="40" cy="10" r="1.5"/>
    </g>
  </g>

  <!-- Striped Towel at Left -->
  <polygon points="0,200 300,100 450,675 0,675" fill="#E8ECEF" filter="url(#shadow)"/>
  <path d="M50,180 L200,675" stroke="#1565C0" stroke-width="12" opacity="0.8"/>
  <path d="M90,165 L240,675" stroke="#1565C0" stroke-width="6" opacity="0.8"/>

  <!-- Main Glass Bowl of Whipped Fresh Cream -->
  <g transform="translate(560, 420)" filter="url(#shadow)">
    <!-- Bowl Base Shadow -->
    <ellipse cx="0" cy="110" rx="230" ry="70" fill="#000" opacity="0.25"/>

    <!-- Clear Glass Bowl Body -->
    <path d="M-220,-40 C-220,100 -120,150 0,150 C120,150 220,100 220,-40 Z" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Fluffy Whipped Cream Fill -->
    <path d="M-210,-40 C-210,50 -110,130 0,130 C110,130 210,50 210,-40 C170,-100 80,-80 0,-100 C-80,-80 -170,-100 -210,-40 Z" fill="url(#whippedCream)"/>

    <!-- Cream Peaks & Fluffy Swirl Waves -->
    <path d="M-180,-30 Q-120,-90 -60,-40 Q0,-120 60,-50 Q120,-90 180,-30 C140,-10 -140,-10 -180,-30 Z" fill="#FFFFFF"/>
    <path d="M-100,-40 C-60,-70 -20,-60 0,-80 C20,-60 60,-70 100,-40 C50,-30 -50,-30 -100,-40 Z" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="2"/>

    <!-- Stainless Steel Spoon inserted into Cream -->
    <g transform="translate(40, -110) rotate(25)" filter="url(#shadow)">
      <!-- Spoon Handle -->
      <path d="M0,0 L20,-220 L35,-220 L15,0 Z" fill="url(#spoonMetal)"/>
      <!-- Spoon Bowl inserted -->
      <ellipse cx="5" cy="20" rx="30" ry="45" fill="url(#spoonMetal)"/>
      <ellipse cx="0" cy="15" rx="22" ry="35" fill="#FFFFFF" opacity="0.6"/>
    </g>

    <!-- Glass Rim Highlight -->
    <ellipse cx="0" cy="-40" rx="220" ry="35" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.8"/>
  </g>

  <!-- Bottom Right Text Overlay "Fresh Cream" -->
  <text x="1140" y="630" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="bold" text-anchor="end" fill="#1C2833" opacity="0.9">
    Fresh Cream
  </text>
</svg>
