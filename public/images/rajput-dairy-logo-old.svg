<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Leather background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#DE9E2C"/>
      <stop offset="50%" stop-color="#BA7B18"/>
      <stop offset="100%" stop-color="#804E05"/>
    </radialGradient>

    <!-- Gold metallic gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF3C4"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#FED053"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#7A5200"/>
      <stop offset="100%" stop-color="#543800"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAF8F0"/>
      <stop offset="100%" stop-color="#E8E2CF"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background leather surface -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle leather grain texture overlay -->
  <rect width="800" height="800" fill="#000000" opacity="0.05"/>

  <!-- Outer gold double ring seal -->
  <g filter="url(#dropShadow)">
    <circle cx="400" cy="400" r="320" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
    <circle cx="400" cy="400" r="302" fill="none" stroke="url(#goldDark)" stroke-width="4"/>
    <circle cx="400" cy="400" r="285" fill="none" stroke="url(#goldGrad)" stroke-width="18"/>
    <circle cx="400" cy="400" r="268" fill="none" stroke="url(#goldDark)" stroke-width="3"/>
  </g>

  <!-- Inner Seal Archs -->
  <circle cx="400" cy="400" r="250" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.8"/>
  <circle cx="400" cy="400" r="235" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Top Wheat Stalks & Milk Drop -->
  <g transform="translate(400, 205)" filter="url(#dropShadow)">
    <!-- Milk Droplet -->
    <path d="M0,-35 C-8,-20 -12,-10 -12,-2 C-12,8 -5,14 0,14 C5,14 12,8 12,-2 C12,-10 8,-20 0,-35 Z" fill="url(#ribbonGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Left Wheat -->
    <path d="M-5,5 Q-30,-15 -55,-25 Q-35,-15 -10,12" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M-20,-12 C-28,-22 -38,-20 -35,-10 C-30,-5 -22,-8 -20,-12 Z" fill="url(#goldGrad)"/>
    <path d="M-35,-18 C-45,-28 -55,-22 -50,-12 C-45,-8 -38,-12 -35,-18 Z" fill="url(#goldGrad)"/>
    <!-- Right Wheat -->
    <path d="M5,5 Q30,-15 55,-25 Q35,-15 10,12" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M20,-12 C28,-22 38,-20 35,-10 C30,-5 22,-8 20,-12 Z" fill="url(#goldGrad)"/>
    <path d="M35,-18 C45,-28 55,-22 50,-12 C45,-8 38,-12 35,-18 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Three Golden Stars -->
  <g filter="url(#dropShadow)">
    <!-- Center Star -->
    <polygon points="400,280 406,298 425,298 410,309 415,327 400,316 385,327 390,309 375,298 394,298" fill="url(#goldGrad)"/>
    <!-- Left Star -->
    <polygon points="340,295 344,308 358,308 347,316 351,329 340,321 329,329 333,316 322,308 336,308" fill="url(#goldGrad)"/>
    <!-- Right Star -->
    <polygon points="460,295 464,308 478,308 467,316 471,329 460,321 449,329 453,316 442,308 456,308" fill="url(#goldGrad)"/>
  </g>

  <!-- Ribbon Banner (Back tails) -->
  <path d="M80,450 L160,400 L160,490 L80,530 L110,480 Z" fill="url(#goldDark)" filter="url(#dropShadow)"/>
  <path d="M720,450 L640,400 L640,490 L720,530 L690,480 Z" fill="url(#goldDark)" filter="url(#dropShadow)"/>

  <!-- Ribbon Banner Main Body -->
  <g filter="url(#dropShadow)">
    <path d="M140,410 C280,380 520,380 660,410 L650,500 C510,470 290,470 150,500 Z" fill="url(#ribbonGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Inner border on ribbon -->
    <path d="M150,420 C280,392 520,392 650,420" fill="none" stroke="url(#goldDark)" stroke-width="2"/>
    <path d="M160,488 C290,460 510,460 640,488" fill="none" stroke="url(#goldDark)" stroke-width="2"/>
  </g>

  <!-- Banner Text: Rajput Dairy -->
  <text x="400" y="465" font-family="'Georgia', 'Times New Roman', serif" font-size="62" font-weight="bold" text-anchor="middle" fill="#784B00" letter-spacing="1">
    Rajput Dairy
  </text>
  <text x="400" y="463" font-family="'Georgia', 'Times New Roman', serif" font-size="62" font-weight="bold" text-anchor="middle" fill="url(#goldDark)" letter-spacing="1">
    Rajput Dairy
  </text>

  <!-- Tagline below banner -->
  <g filter="url(#dropShadow)">
    <text x="400" y="535" font-family="'Georgia', 'Times New Roman', serif" font-size="28" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="2">
      Serving You
    </text>
    <text x="400" y="570" font-family="'Georgia', 'Times New Roman', serif" font-size="32" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="3">
      Since 1984
    </text>
  </g>

  <!-- Bottom Cow Head Emblem -->
  <g transform="translate(400, 630)" filter="url(#dropShadow)">
    <!-- Outer arch rays -->
    <path d="M-80,-20 C-40,-40 40,-40 80,-20" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M-100,0 C-50,-25 50,-25 100,0" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Golden Cow Head -->
    <path d="M0,-20 C-12,-20 -22,-10 -25,-2 C-35,-8 -45,-5 -42,5 C-38,15 -28,12 -22,12 C-20,22 -10,32 0,32 C10,32 20,22 22,12 C28,12 38,15 42,5 C45,-5 35,-8 25,-2 C22,-10 12,-20 0,-20 Z" fill="url(#goldGrad)" stroke="url(#goldDark)" stroke-width="2"/>
    <!-- Cow Horns -->
    <path d="M-18,-15 C-28,-30 -38,-28 -42,-22 C-38,-20 -28,-18 -22,-10" fill="url(#goldGrad)"/>
    <path d="M18,-15 C28,-30 38,-28 42,-22 C38,-20 28,-18 22,-10" fill="url(#goldGrad)"/>
    <!-- Cow Nose & Eyes -->
    <circle cx="-8" cy="-2" r="2.5" fill="#543800"/>
    <circle cx="8" cy="-2" r="2.5" fill="#543800"/>
    <ellipse cx="0" cy="18" rx="8" ry="5" fill="#543800" opacity="0.4"/>
  </g>
</svg>
