<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6239"/>
      <stop offset="50%" stop-color="#6F4B23"/>
      <stop offset="100%" stop-color="#4F3312"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="gheeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A1"/>
      <stop offset="40%" stop-color="#F2B818"/>
      <stop offset="85%" stop-color="#D99100"/>
      <stop offset="100%" stop-color="#B87500"/>
    </radialGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0522D"/>
      <stop offset="60%" stop-color="#703618"/>
      <stop offset="100%" stop-color="#48200B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background / Room & Window Light -->
  <rect width="1200" height="675" fill="#52391F"/>
  <polygon points="0,0 500,0 350,675 0,675" fill="url(#windowLight)"/>

  <!-- Wooden Plank Table -->
  <path d="M0,280 L1200,220 L1200,675 L0,675 Z" fill="url(#woodTable)"/>
  <!-- Plank lines -->
  <line x1="0" y1="360" x2="1200" y2="300" stroke="#3A230B" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="470" x2="1200" y2="410" stroke="#3A230B" stroke-width="4" opacity="0.7"/>
  <line x1="0" y1="580" x2="1200" y2="520" stroke="#3A230B" stroke-width="5" opacity="0.8"/>

  <!-- Background Matka / Clay Pot (Left) -->
  <g transform="translate(470, 100)" filter="url(#shadow)" opacity="0.85">
    <path d="M0,80 C-40,80 -70,120 -70,170 C-70,230 -20,260 0,260 C20,260 70,230 70,170 C70,120 40,80 0,80 Z" fill="url(#clayGrad)"/>
    <ellipse cx="0" cy="80" rx="42" ry="12" fill="#703618" stroke="#A0522D" stroke-width="3"/>
  </g>

  <!-- Folded Linen Napkin (Right) -->
  <polygon points="620,440 1200,380 1200,675 510,675" fill="#E3DFD5" filter="url(#shadow)"/>
  <path d="M620,440 L1200,380" stroke="#D1CDC2" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Green Coriander Leaf on Napkin -->
  <g transform="translate(850, 520) rotate(-15)">
    <path d="M0,0 Q30,-40 60,-20 Q80,-50 100,-20 Q80,20 0,0" fill="#4CAF50"/>
    <path d="M0,0 Q20,-20 50,-10" stroke="#2E7D32" stroke-width="2" fill="none"/>
  </g>

  <!-- Green Cardamom Pods on Table -->
  <g transform="translate(580, 580)">
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="#8BC34A" stroke="#558B2F" stroke-width="1.5" transform="rotate(-20)"/>
    <ellipse cx="25" cy="10" rx="11" ry="5.5" fill="#7CB342" stroke="#33691E" stroke-width="1.5" transform="rotate(35)"/>
    <ellipse cx="-20" cy="15" rx="10" ry="5" fill="#8BC34A" stroke="#558B2F" stroke-width="1.5" transform="rotate(-60)"/>
  </g>

  <!-- Main Glass Jar with Cow Ghee -->
  <g transform="translate(600, 400)" filter="url(#shadow)">
    <!-- Jar Shadow Base -->
    <ellipse cx="0" cy="180" rx="170" ry="35" fill="#000" opacity="0.4"/>

    <!-- Glass Body Fill (Golden Ghee) -->
    <path d="M-150,-80 L150,-80 C170,-80 175,-50 175,-30 L175,130 C175,170 140,185 0,185 C-140,185 -175,170 -175,130 L-175,-30 C-175,-50 -170,-80 -150,-80 Z" fill="url(#gheeGlow)"/>

    <!-- Granular texture overlay (Danedar dots) -->
    <g fill="#FFF5B8" opacity="0.6">
      <circle cx="-60" cy="20" r="3"/><circle cx="40" cy="80" r="4"/><circle cx="-100" cy="100" r="2.5"/><circle cx="80" cy="-20" r="3.5"/>
      <circle cx="10" cy="40" r="5"/><circle cx="-40" cy="120" r="3"/><circle cx="120" cy="60" r="2.5"/><circle cx="-120" cy="-10" r="4"/>
      <circle cx="20" cy="-50" r="3"/><circle cx="-80" cy="60" r="3.5"/><circle cx="60" cy="130" r="4"/><circle cx="-20" cy="150" r="3"/>
    </g>

    <!-- Glass Outline & Highlights -->
    <path d="M-150,-80 L150,-80 C170,-80 175,-50 175,-30 L175,130 C175,170 140,185 0,185 C-140,185 -175,170 -175,130 L-175,-30 C-175,-50 -170,-80 -150,-80 Z" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>

    <!-- Glass Jar Neck & Lip -->
    <rect x="-140" y="-115" width="280" height="35" rx="8" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Glass Lid Knob -->
    <path d="M-130,-115 C-130,-140 -80,-150 0,-150 C80,-150 130,-140 130,-115 Z" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="-180" r="35" fill="url(#glassReflection)" stroke="#FFFFFF" stroke-width="3"/>
    <ellipse cx="-10" cy="-190" rx="12" ry="6" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Bottom Right Text Overlay "Cow Ghee" -->
  <text x="1140" y="630" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="bold" text-anchor="end" fill="#2A1B0A" opacity="0.9">
    Cow Ghee
  </text>
</svg>
