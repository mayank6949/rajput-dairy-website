<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="darkWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382515"/>
      <stop offset="50%" stop-color="#24160A"/>
      <stop offset="100%" stop-color="#120A04"/>
    </linearGradient>
    <linearGradient id="slatePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4E54"/>
      <stop offset="50%" stop-color="#2C3036"/>
      <stop offset="100%" stop-color="#1A1C20"/>
    </linearGradient>
    <radialGradient id="khowaGrad" x1="30%" y1="30%" r="70%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="50%" stop-color="#F2E3CA"/>
      <stop offset="85%" stop-color="#DFCDAF"/>
      <stop offset="100%" stop-color="#C5AF8C"/>
    </radialGradient>
    <linearGradient id="brassBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Atmospheric Wood Background -->
  <rect width="1200" height="675" fill="url(#darkWood)"/>

  <!-- Top Right Brass Bowl with Rose Petals & Cardamom -->
  <g transform="translate(920, 160)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="110" ry="60" fill="url(#brassBowl)" stroke="#FFF3C4" stroke-width="2"/>
    <ellipse cx="0" cy="-5" rx="100" ry="50" fill="#4A3000"/>
    <!-- Rose Petals inside -->
    <path d="M-40,-10 C-60,-30 -20,-30 0,-10 C-20,10 -40,10 -40,-10 Z" fill="#E91E63"/>
    <path d="M10,-20 C30,-35 60,-20 30,0 C10,-10 0,-15 10,-20 Z" fill="#C2185B"/>
    <path d="M-10,0 C10,-15 30,10 0,20 C-20,10 -20,5 -10,0 Z" fill="#F48FB1"/>
    <!-- Cardamom Pods -->
    <ellipse cx="40" cy="10" rx="10" ry="5" fill="#8BC34A" transform="rotate(-30)"/>
  </g>

  <!-- Dark Slate Ceramic Plate lined with Cloth -->
  <g transform="translate(560, 420)" filter="url(#shadow)">
    <!-- Plate Shadow -->
    <ellipse cx="0" cy="70" rx="310" ry="120" fill="#000" opacity="0.6"/>
    <!-- Slate Plate Body -->
    <ellipse cx="0" cy="40" rx="300" ry="110" fill="url(#slatePlate)"/>
    <ellipse cx="0" cy="35" rx="280" ry="100" fill="#24272C"/>

    <!-- White Cloth Liner -->
    <path d="M-220,10 C-180,-60 180,-60 220,10 C240,60 -200,90 -220,10 Z" fill="#EFECE6"/>

    <!-- Main Crumbly Block of Fresh Khowa / Mawa -->
    <g transform="translate(0, -30)">
      <!-- Block Shadow -->
      <ellipse cx="0" cy="60" rx="170" ry="60" fill="#1A130B" opacity="0.5"/>

      <!-- Irregular Dense Crumbly Block -->
      <path d="M-150,10 C-160,-20 -120,-60 0,-70 C120,-60 160,-20 150,10 C140,50 80,70 0,75 C-80,70 -140,50 -150,10 Z" fill="url(#khowaGrad)"/>

      <!-- Top Crumbly Texture Waves & Ridges -->
      <path d="M-120,-20 C-80,-50 80,-50 120,-20 C80,0 -80,0 -120,-20 Z" fill="#FFFDF9"/>
      <path d="M-80,-30 C-40,-50 40,-50 80,-30 C40,-15 -40,-15 -80,-30 Z" fill="#FAF3E6"/>

      <!-- Scattered Khowa Crumbles on Cloth -->
      <g fill="#F2E3CA">
        <ellipse cx="-180" cy="30" rx="12" ry="7"/><ellipse cx="-160" cy="50" rx="8" ry="5"/>
        <ellipse cx="170" cy="20" rx="10" ry="6"/><ellipse cx="190" cy="40" rx="14" ry="8"/>
        <ellipse cx="140" cy="60" rx="9" ry="5"/><ellipse cx="-130" cy="65" rx="11" ry="6"/>
      </g>
    </g>
  </g>

  <!-- Cardamom & Rose Petal Garnish (Foreground Left) -->
  <g transform="translate(250, 560)">
    <path d="M0,0 C-20,-20 20,-20 0,-40 C20,-20 20,0 0,0 Z" fill="#E91E63"/>
    <ellipse cx="30" cy="-10" rx="12" ry="6" fill="#8BC34A" stroke="#33691E" stroke-width="1.5" transform="rotate(20)"/>
  </g>

  <!-- Bottom Right Text Overlay "Khowa (Mawa)" -->
  <text x="1140" y="630" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="bold" text-anchor="end" fill="#F5E6D3" opacity="0.9">
    Khowa (Mawa)
  </text>
</svg>
