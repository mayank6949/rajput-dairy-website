<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4828"/>
      <stop offset="50%" stop-color="#472E16"/>
      <stop offset="100%" stop-color="#28180A"/>
    </linearGradient>
    <radialGradient id="terracottaClay" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D97746"/>
      <stop offset="50%" stop-color="#B85323"/>
      <stop offset="100%" stop-color="#6C2809"/>
    </radialGradient>
    <radialGradient id="lowFatCurd" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F7F7F7"/>
      <stop offset="100%" stop-color="#E5E5E5"/>
    </radialGradient>
    <linearGradient id="spoonMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B0B0B0"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Rustic Wooden Table Background -->
  <rect width="1200" height="675" fill="url(#woodTable)"/>

  <!-- Glass Jar labelled "LOW FAT CURD - 0.5% FAT" in Background Right -->
  <g transform="translate(930, 210)" filter="url(#shadow)">
    <!-- Glass Jar Body -->
    <rect x="-60" y="-80" width="120" height="160" rx="12" fill="#EBF4FA" opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="-55" y="-30" width="110" height="100" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Label Sticker -->
    <rect x="-50" y="-15" width="100" height="60" fill="#F0F8FF" rx="4" stroke="#4682B4" stroke-width="2"/>
    <text x="0" y="5" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1E3A8A">
      LOW FAT CURD
    </text>
    <text x="0" y="25" font-family="'Arial', sans-serif" font-size="14" font-weight="extrabold" text-anchor="middle" fill="#2563EB">
      0.5% FAT
    </text>

    <!-- Cork Lid -->
    <rect x="-40" y="-102" width="80" height="22" rx="4" fill="#A06830"/>
  </g>

  <!-- Main Terracotta Clay Matka Bowl with Smooth Low Fat Curd -->
  <g transform="translate(540, 420)" filter="url(#shadow)">
    <!-- Bowl Shadow -->
    <ellipse cx="0" cy="140" rx="220" ry="60" fill="#000" opacity="0.5"/>

    <!-- Terracotta Clay Bowl Body -->
    <path d="M-210,-20 C-210,100 -120,160 0,160 C120,160 210,100 210,-20 L210,-40 L-210,-40 Z" fill="url(#terracottaClay)"/>

    <!-- Clay Rim -->
    <ellipse cx="0" cy="-40" rx="210" ry="42" fill="url(#terracottaClay)"/>
    <ellipse cx="0" cy="-40" rx="195" ry="38" fill="#4A1803"/>

    <!-- Smooth Creamy Low Fat Curd Fill -->
    <ellipse cx="0" cy="-40" rx="185" ry="34" fill="url(#lowFatCurd)"/>

    <!-- Soft Spoon Swirl in Curd -->
    <path d="M-90,-40 C-30,-55 30,-55 90,-30 C30,-25 -30,-25 -90,-40 Z" fill="#FFFFFF"/>

    <!-- Silver Spoon inside -->
    <g transform="translate(40, -100) rotate(20)" filter="url(#shadow)">
      <path d="M0,0 L15,-150 L28,-150 L10,0 Z" fill="url(#spoonMetal)"/>
      <ellipse cx="5" cy="15" rx="24" ry="34" fill="url(#spoonMetal)"/>
      <ellipse cx="0" cy="10" rx="18" ry="25" fill="#FFFFFF" opacity="0.7"/>
    </g>
  </g>

  <!-- Bottom Right Text Overlay "Low Fat Curd" -->
  <text x="1140" y="630" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="bold" text-anchor="end" fill="#F8F9FA" opacity="0.9">
    Low Fat Curd
  </text>
</svg>
