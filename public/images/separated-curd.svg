<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="woodTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3E21"/>
      <stop offset="50%" stop-color="#3D2712"/>
      <stop offset="100%" stop-color="#241508"/>
    </linearGradient>
    <linearGradient id="copperMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F39268"/>
      <stop offset="30%" stop-color="#C85A2A"/>
      <stop offset="60%" stop-color="#E27848"/>
      <stop offset="100%" stop-color="#7B2C0B"/>
    </linearGradient>
    <radialGradient id="wheyLiquid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF5DA"/>
      <stop offset="70%" stop-color="#ECE2B5"/>
      <stop offset="100%" stop-color="#D5C78D"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Rustic Wood Surface -->
  <rect width="1200" height="675" fill="url(#woodTable)"/>

  <!-- Glass Jar Labelled "WHEY" in Background Right -->
  <g transform="translate(920, 220)" filter="url(#shadow)">
    <!-- Jar Base & Liquid -->
    <rect x="-50" y="-80" width="100" height="150" rx="10" fill="#EFE8C3" opacity="0.8" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="-45" y="-30" width="90" height="95" fill="#DDD092" opacity="0.9"/>
    <rect x="-40" y="-5" width="80" height="40" fill="#FFFFFF" rx="4" stroke="#8C8252" stroke-width="1.5"/>
    <text x="0" y="20" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#3D371E">
      WHEY
    </text>
    <!-- Cork / Lid -->
    <rect x="-35" y="-100" width="70" height="20" rx="4" fill="#A06830"/>
  </g>

  <!-- Traditional Antique Copper Handi / Bowl with Separated Curd -->
  <g transform="translate(540, 420)" filter="url(#shadow)">
    <!-- Bowl Base Shadow -->
    <ellipse cx="0" cy="130" rx="230" ry="60" fill="#000" opacity="0.5"/>

    <!-- Copper Handi Body -->
    <path d="M-220,-30 C-220,90 -130,150 0,150 C130,150 220,90 220,-30 L220,-50 L-220,-50 Z" fill="url(#copperMetal)"/>

    <!-- Copper Rim -->
    <ellipse cx="0" cy="-50" rx="220" ry="45" fill="url(#copperMetal)"/>
    <ellipse cx="0" cy="-50" rx="205" ry="40" fill="#521B05"/>

    <!-- Whey Liquid Layer in Bowl -->
    <ellipse cx="0" cy="-50" rx="195" ry="36" fill="url(#wheyLiquid)"/>

    <!-- Dense Separated Curd (Chakka) Curds floating in Whey -->
    <g fill="#FFFFFF" filter="url(#shadow)">
      <ellipse cx="-70" cy="-55" rx="60" ry="25"/>
      <ellipse cx="50" cy="-45" rx="70" ry="28"/>
      <ellipse cx="-10" cy="-60" rx="40" ry="18"/>
      <ellipse cx="10" cy="-35" rx="50" ry="20"/>
    </g>

    <!-- Metal Fork Resting inside -->
    <g transform="translate(110, -90) rotate(-35)" filter="url(#shadow)">
      <rect x="-4" y="-80" width="8" height="120" rx="2" fill="#D0D5DD"/>
      <!-- Prongs -->
      <rect x="-12" y="40" width="4" height="30" fill="#D0D5DD"/>
      <rect x="-4" y="40" width="4" height="30" fill="#D0D5DD"/>
      <rect x="4" y="40" width="4" height="30" fill="#D0D5DD"/>
      <rect x="12" y="40" width="4" height="30" fill="#D0D5DD"/>
    </g>
  </g>

  <!-- Bottom Right Text Overlay "Separated Curd" -->
  <text x="1140" y="630" font-family="'Georgia', 'Times New Roman', serif" font-size="52" font-weight="bold" text-anchor="end" fill="#F8F3E6" opacity="0.9">
    Separated Curd
  </text>
</svg>
